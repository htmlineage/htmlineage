name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:package
      # A GitHub pre-release publishes under `next`, so `npx htmlineage` keeps
      # resolving to the last stable version.
      # No token: npm trusts this workflow through OIDC (the id-token permission
      # above) and adds provenance itself. The package's npm settings must name
      # this repository and publish.yml as its trusted publisher.
      - name: Publish
        run: npm publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
